[project]
name = "lessonforge-backend"
version = "0.1.0"
description = "LessonForge AI modular monolith backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "alembic>=1.13,<2",
  "pyjwt>=2.9,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.9,<1",
  "langchain>=0.3,<1",
  "langgraph>=0.2,<1",
  "langgraph-checkpoint-sqlite>=2,<4",
  "httpx>=0.27,<1",
  "tenacity>=9,<10",
  "python-pptx>=1.0,<2",
  "python-docx>=1.1,<2",
  "cairosvg>=2.7,<3",
  "pypdf>=5,<7",
  "structlog>=24,<26",
  "cryptography>=44,<47"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "asgi-lifespan>=2,<3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
